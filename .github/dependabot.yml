version: 2
updates:
  # GitHub Actions — keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns: ["*"]

  # Python runtime + dev dependencies declared in pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Only raise a floor when the new release falls outside it. `increase` raised the
    # runtime aiohttp floor past Home Assistant's pinned version and broke installs.
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
      - "python"
    groups:
      python:
        patterns:
          - "*"

  # .pre-commit-config.yaml hook revs, batched into one weekly PR.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      pre-commit:
        patterns:
          - "*"
